roke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/></svg></a></section></div><div class="free-block" style="--place-x:100;--place-y:0;--place-turn:0deg;--place-scale:1;--place-top:0px;--place-width:42%"><section class="section"><p class="text">для телефонов</p></section></div><div class="free-block" style="--place-x:69;--place-y:0;--place-turn:0deg;--place-scale:1;--place-top:24px"><section class="section button-section"><a class="cta" href="files/OBI-Browser-A1-6-1-Android.apk" download="OBI-Browser-A1-6-1-Android.apk">скачать последнию версию 1.6.1<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/></svg></a></section></div><div class="free-block" style="--place-x:68;--place-y:0;--place-turn:0deg;--place-scale:1;--place-top:35px;--place-width:42%"><section class="section"><p class="text">версии 1.6 нету</p></section></div><div class="free-block" style="--place-x:68;--place-y:0;--place-turn:0deg;--place-scale:1;--place-top:160px;--place-width:42%"><section class="section"><p class="text">версии 1.5 нету</p></section></div><div class="free-block" style="--place-x:64;--place-y:0;--place-turn:0deg;--place-scale:1;--place-top:94px"><section class="section button-section"><a class="cta" href="files/OBI-Browser-1.5.1-Android-2.apk" download="OBI-Browser-1.5.1-Android.apk">скачать версию 1.5.1<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/></svg></a></section></div></div></main></div><script>(function mountFreeLayout(layer) {
  const main = layer.parentElement;
  const flow = layer.previousElementSibling;
  const frame = main.parentElement;
  const view = layer.ownerDocument.defaultView;
  const viewport = layer.ownerDocument.documentElement;
  const blocks = Array.from(layer.children,node=>{
    const content = node.firstElementChild;
    const button = content.classList.contains("button-section");
    return {node,content,button,target:button ? content.firstElementChild : content};
  });
  const refresh = () => {
    const areaWidth = layer.clientWidth;
    if (!areaWidth) return;
    const geometry = blocks.map(({node,content,button,target})=>{
      const turn = parseFloat(node.style.getPropertyValue("--place-turn"))*Math.PI/180;
      const cos = Math.abs(Math.cos(turn)), sin = Math.abs(Math.sin(turn));
      const w = target.offsetWidth, h = target.offsetHeight;
      const rotatedWidth = w*cos+h*sin;
      const requestedScale = parseFloat(node.style.getPropertyValue("--place-scale")) || 1;
      const scale = Math.min(requestedScale,areaWidth/Math.max(1,rotatedWidth));
      return {
        node,scale,width:rotatedWidth*scale,height:(w*sin+h*cos)*scale,
        top:parseFloat(node.style.getPropertyValue("--place-top")),
        centerX:target.offsetLeft+w/2+(button?content.offsetLeft:0),
        centerY:target.offsetTop+h/2+(button?content.offsetTop:0)
      };
    });
    const padding = parseFloat(view.getComputedStyle(main).paddingBottom) || 0;
    const chrome = (frame.querySelector(".site-head")?.offsetHeight ?? 0)+(frame.querySelector(".site-footer")?.offsetHeight ?? 0);
    // Relative positions use the ordinary page height. New space below them
    // must not shift blocks that were already placed.
    const baseHeight = Math.max(156,viewport.clientHeight-chrome-64,flow.offsetHeight+padding-64,
      ...geometry.filter(item=>!item.node.classList.contains("free-sheet")).map(item=>item.height));
    const heightNeeded = Math.ceil(Math.max(baseHeight,...geometry.filter(item=>Number.isFinite(item.top)).map(item=>item.top+item.height)));
    main.style.setProperty("--free-height",heightNeeded+"px");
    for (const {node,scale,width,height,centerX,centerY} of geometry) {
      const style = node.style;
      style.setProperty("--fit-scale",scale);
      style.setProperty("--fit-room-x",Math.max(0,areaWidth-width)+"px");
      style.setProperty("--fit-room-y",Math.max(0,baseHeight-height)+"px");
      style.setProperty("--fit-offset-x",width/2-centerX+"px");
      style.setProperty("--fit-offset-y",height/2-centerY+"px");
      style.setProperty("--fit-center-x",centerX+"px");
      style.setProperty("--fit-right",centerX+width/2+"px");
      style.setProperty("--fit-bottom",centerY+height/2+"px");
    }
  };
  const observer = new view.ResizeObserver(refresh);
  observer.observe(layer);
  observer.observe(flow);
  observer.observe(viewport);
  for (const {target} of blocks) observer.observe(target);
  refresh();
  return {blocks,refresh};
})(document.querySelector(".free-layer"));</script></body></html>
